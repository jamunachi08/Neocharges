[project]
name = "neocharges"
authors = [{ name = "Neotec Integrated Solutions", email = "support@neotec.sa" }]
description = "Document-level debit/credit charge lines posting an independent Journal Entry"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "neocharges"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
indent-style = "tab"
